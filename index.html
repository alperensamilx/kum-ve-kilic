<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b110a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kum ve Kılıç">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Kum ve Kılıç</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coin" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm0 3a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM11 8h2v8h-2z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.6-4.6-9.6-9.3C.9 8.3 3.1 4.4 6.8 4.4c2.1 0 3.5 1.1 5.2 3 1.7-1.9 3.1-3 5.2-3 3.7 0 5.9 3.9 4.4 7.3C19.6 16.4 12 21 12 21z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2L4 14h6.5L9.5 22 20 9.5h-6.6z"/></symbol>
  <symbol id="i-crowd" viewBox="0 0 24 24"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5v1H2zm13.2-5.3c.3 0 .5-.1.8-.1 3.3 0 6 2.2 6 5.4v1h-6v-1c0-2-.3-3.8-.8-5.3z"/></symbol>
  <symbol id="i-sword" viewBox="0 0 24 24"><path d="M21 2.5l-.5 4.2-8.6 8.6-3.2-3.2 8.6-8.6zM5.3 12.3l1.4-1.4 6.4 6.4-1.4 1.4-1.4-1.4-2.4 2.4.4 1.6-1.6 1.6-3.2-3.2 1.6-1.6 1.6.4 2.4-2.4z"/></symbol>
  <symbol id="i-swords" viewBox="0 0 24 24"><path d="M3 2.5l4.2.5 6 6-2.1 2.1-6-6zm18 0l-.5 4.2-8.4 8.4-2.1-2.1 8.4-8.4zM4.2 15.3l1.4-1.4 4.5 4.5-1.4 1.4-1-1-1.9 1.9.3 1.3-1.3 1.3-2.6-2.6 1.3-1.3 1.3.3 1.9-1.9zm15.6 0l-1-1-4.5 4.5 1.4 1.4 1-1 1.9 1.9-.3 1.3 1.3 1.3 2.6-2.6-1.3-1.3-1.3.3-1.9-1.9z"/></symbol>
  <symbol id="i-fist" viewBox="0 0 24 24"><path d="M5 21c-1.4-3.4-.4-7 2.2-9.3l1.6-5c.5-1.6 2.2-2.6 3.8-2.1l1.9.6-1.1 3.4-1.6-.5-.9 2.9c2.3-.6 4.8.1 6.5 1.8 2.4 2.4 2.4 6.2 0 8.6-1.2 1.1-2.8 1.6-4.5 1.6z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2l8.5 3.2v6.2c0 5.2-3.6 9.6-8.5 11.1-4.9-1.5-8.5-5.9-8.5-11.1V5.2z"/></symbol>
  <symbol id="i-wind" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M3 8.5h10.5a3 3 0 1 0-3-3M3 12.5h15a3 3 0 1 1-3 3M3 16.5h7"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 3.5l4.5 7.5L21 7l-1.6 10H4.6zM4.6 18.5h14.8V21H4.6z"/></symbol>
  <symbol id="i-hammer" viewBox="0 0 24 24"><path d="M13.8 2.8l7.4 7.4-3.1 3.1-2.1-2.1-8.7 8.7a2.2 2.2 0 0 1-3.1-3.1l8.7-8.7-2.1-2.1z"/></symbol>
  <symbol id="i-helmet" viewBox="0 0 24 24"><path d="M12 2.5c-5 0-8.5 3.6-8.5 8.4v3.8l3.3 2.4v-5.4h3.1v8.8h4.2v-8.8h3.1v5.4l3.3-2.4v-3.8c0-4.8-3.5-8.4-8.5-8.4z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 4.5L7.5 12 15 19.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M20 12H5m6-6.5L4.5 12l6.5 6.5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M4 12h15m-6-6.5l6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="i-rest" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M3 10c3 0 3-3 6-3s3 3 6 3 3-3 6-3M3 16.5c3 0 3-3 6-3s3 3 6 3 3-3 6-3"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1 4.2 6.5 6.4 6.5 12.3a6.5 6.5 0 0 1-13 0c0-3.2 2-5.3 3.2-7.3 0 2.2 1 3.4 2.3 3.6C10.6 7.4 10.8 4.8 12 2z"/></symbol>
  <symbol id="i-burst" viewBox="0 0 24 24"><path d="M12 1.5l2.2 6.3 6.6-1.7-4.4 5.2 4.9 4.6-6.6-.4-1 6.7-2.9-6-5.9 3 1.9-6.4L1 9.7l6.6-1.3z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3.5 9v6h4l5.5 4.5v-15L7.5 9zm13.3-2.4a7.4 7.4 0 0 1 0 10.8l-1.5-1.5a5.3 5.3 0 0 0 0-7.8zm-2.6 2.7a3.6 3.6 0 0 1 0 5.4l-1.4-1.5a1.6 1.6 0 0 0 0-2.4z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3.5 9v6h4l5.5 4.5v-15L7.5 9zm12.1.1l1.4-1.4 2.3 2.3 2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3z"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm2 3.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm-8 9c0-4 3.6-6.8 8-6.8s8 2.8 8 6.8v1H4z"/></symbol>
  <symbol id="i-arena" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2 9c0-2.5 4.5-4.5 10-4.5S22 6.5 22 9v8.5c0 1.8-4.5 3-10 3s-10-1.2-10-3zm3 3.2v3.6h2.2v-3.4zm4.4.5v3.5h2.2v-3.5zm4.4 0v3.5H16v-3.5zm4.4-.5v3.4H19v-3.6z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7 10V7.5a5 5 0 0 1 10 0V10h1.5v11h-13V10zm2.5 0h5V7.5a2.5 2.5 0 0 0-5 0z"/></symbol>
</svg>

<button id="mute" class="btn icon" aria-label="Sesi aç/kapat"><svg class="ic"><use href="#i-vol"/></svg></button>
<div id="fade"></div>

<div id="app">

<!-- BAŞLIK -->
<section class="screen" id="s-title">
  <div class="title-art">
    <canvas id="cvTitle" class="scene"></canvas>
    <h1 class="logo">Kum<small>ve</small>Kılıç</h1>
  </div>
  <div class="panel">
    <p class="lore">Esir düştün. Özgürlüğün tek yolu, kalabalığın önünde kanla ve kumla kazanmak.</p>
    <div class="stack">
      <button class="btn primary big" onclick="go('create')">Yeni Gladyatör</button>
      <button class="btn" id="btnContinue" onclick="continueGame()">Devam Et</button>
    </div>
  </div>
</section>

<!-- KARAKTER OLUŞTUR -->
<section class="screen" id="s-create">
  <div class="bar"><button class="btn icon ghost" onclick="go('title')" aria-label="Geri"><svg class="ic"><use href="#i-back"/></svg></button><h2 class="ttl">Gladyatörünü Yarat</h2></div>
  <div class="sticky">
    <canvas id="cvCreate" class="scene doll"></canvas>
    <div class="derived" id="cDerived"></div>
  </div>
  <input id="nameIn" class="field" maxlength="14" placeholder="Gladyatörünün adı" autocomplete="off">
  <div class="seg" id="cTabs">
    <button class="on" data-t="stats">Özellikler <span class="badge" id="cPts">0</span></button>
    <button data-t="look">Görünüm</button>
  </div>
  <div class="panel" id="cStatsP"><div id="cStats"></div></div>
  <div class="panel" id="cLookP" hidden><div id="cLook"></div></div>
  <button class="btn primary big" onclick="finishCreate()">Arenaya Gir</button>
</section>

<!-- ŞEHİR -->
<section class="screen" id="s-city">
  <div class="panel hud">
    <div class="hud-id"><b id="hName"></b><small id="hTitle"></small></div>
    <div class="hud-res"><span class="chip">Sv. <b id="hLvl"></b></span><span class="chip gold"><svg class="ic"><use href="#i-coin"/></svg><b id="hGold"></b></span></div>
    <div class="meter xp"><i class="fl" id="hXp"></i></div>
  </div>
  <div class="city-wrap">
    <canvas id="cvCity" class="scene"></canvas>
    <div class="city-hint" id="cityHint">Gitmek istediğin yere dokun</div>
  </div>
  <div class="dock">
    <button class="btn" onclick="cityGo('char')"><svg class="ic"><use href="#i-user"/></svg>Gladyatör</button>
    <button class="btn" onclick="cityGo('train')"><svg class="ic"><use href="#i-fist"/></svg>Antrenman<span class="badge" id="hPts" hidden></span></button>
    <button class="btn" onclick="cityGo('arena')"><svg class="ic"><use href="#i-arena"/></svg>Arena</button>
  </div>
</section>

<!-- GLADYATÖR -->
<section class="screen" id="s-char">
  <div class="bar"><button class="btn icon ghost" onclick="toCity()" aria-label="Geri"><svg class="ic"><use href="#i-back"/></svg></button><h2 class="ttl" id="chName"></h2></div>
  <canvas id="cvChar" class="scene doll"></canvas>
  <div class="panel tight"><div class="lbl"><span id="chTitle"></span><span id="chXpT"></span></div><div class="meter xp"><i class="fl" id="chXp"></i></div></div>
  <div class="panel"><h3>Özellikler</h3><div id="chStats"></div></div>
  <div class="panel"><h3>Teçhizat</h3><div id="chEquip"></div></div>
  <div class="panel"><h3>Kayıt</h3><div id="chRec"></div></div>
  <button class="btn ghost sm" onclick="resetGame()" style="align-self:center">Oyunu sıfırla</button>
</section>

<!-- ANTRENMAN -->
<section class="screen" id="s-train">
  <div class="bar"><button class="btn icon ghost" onclick="toCity()" aria-label="Geri"><svg class="ic"><use href="#i-back"/></svg></button><h2 class="ttl">Antrenman Alanı</h2><span class="badge" id="tPts">0</span></div>
  <div class="sticky">
    <canvas id="cvTrain" class="scene doll"></canvas>
    <div class="derived" id="tDerived"></div>
  </div>
  <div class="panel"><div id="tStats"></div></div>
  <p class="center dim" id="tNote" style="margin:0;font-size:13px"></p>
  <button class="btn primary big" onclick="confirmTrain()">Kaydet</button>
</section>

<!-- DÜKKAN -->
<section class="screen" id="s-shop">
  <div class="bar"><button class="btn icon ghost" onclick="toCity()" aria-label="Geri"><svg class="ic"><use href="#i-back"/></svg></button><h2 class="ttl" id="sTitle"></h2><span class="chip gold"><svg class="ic"><use href="#i-coin"/></svg><b id="sGold"></b></span></div>
  <canvas id="cvShop" class="scene"></canvas>
  <div class="speech" id="sSpeech"></div>
  <div class="tabs" id="sTabs"></div>
  <div class="items" id="sList"></div>
</section>

<!-- ARENA KAPISI -->
<section class="screen" id="s-arena">
  <div class="bar"><button class="btn icon ghost" onclick="toCity()" aria-label="Geri"><svg class="ic"><use href="#i-back"/></svg></button><h2 class="ttl">Arena Kapısı</h2></div>
  <canvas id="cvGate" class="scene"></canvas>
  <p class="lore" style="margin:0">Kalabalık uğulduyor. Rakibini seç: zor rakip, büyük ödül.</p>
  <div class="items" id="foes"></div>
</section>

<!-- DÖVÜŞ -->
<section class="screen" id="s-fight">
  <div class="plates">
    <div class="plate"><div class="nm" id="fPN"></div>
      <div class="lbl"><span>Can</span><span id="fPHt"></span></div>
      <div class="meter hp"><i class="gh" id="fPHg"></i><i class="fl" id="fPH"></i></div>
      <div class="meter sta"><i class="fl" id="fPS"></i></div></div>
    <div class="plate r"><div class="nm" id="fEN"></div>
      <div class="lbl"><span>Can</span><span id="fEHt"></span></div>
      <div class="meter hp"><i class="gh" id="fEHg"></i><i class="fl" id="fEH"></i></div>
      <div class="meter sta"><i class="fl" id="fES"></i></div></div>
  </div>
  <canvas id="cvFight" class="scene"></canvas>
  <div><div class="lbl"><span><svg class="ic s"><use href="#i-crowd"/></svg> Seyirci coşkusu</span><span id="fCt"></span></div><div class="meter crowd"><i class="fl" id="fC"></i></div></div>
  <div id="log"></div>
  <div class="acts" id="acts">
    <button class="btn" data-a="back"><svg class="ic"><use href="#i-left"/></svg>Geri<small>-4 enerji</small></button>
    <button class="btn" data-a="rest"><svg class="ic"><use href="#i-rest"/></svg>Nefeslen<small>+enerji</small></button>
    <button class="btn" data-a="fwd"><svg class="ic"><use href="#i-right"/></svg>İlerle<small>-4 enerji</small></button>
    <button class="btn atk" data-a="quick"><svg class="ic"><use href="#i-sword"/></svg>Hızlı<small></small></button>
    <button class="btn atk" data-a="normal"><svg class="ic"><use href="#i-swords"/></svg>Normal<small></small></button>
    <button class="btn atk" data-a="power"><svg class="ic"><use href="#i-burst"/></svg>Güçlü<small></small></button>
    <button class="btn wide" data-a="taunt"><svg class="ic"><use href="#i-flame"/></svg>Alay Et <small>karizma</small></button>
  </div>
</section>

<!-- SONUÇ -->
<section class="screen" id="s-result">
  <canvas id="cvResult" class="scene"></canvas>
  <div class="res-title" id="rTitle"></div>
  <div class="panel" id="rBody"></div>
  <button class="btn primary big" onclick="toCity()">Şehre Dön</button>
</section>

</div>
<script src="js/data.js"></script>
<script src="js/gfx.js"></script>
<script src="js/sfx.js"></script>
<script src="js/hero.js"></script>
<script src="js/body.js"></script>
<script src="js/gear.js"></script>
<script src="js/scenes.js"></script>
<script src="js/city-art.js"></script>
<script src="js/city-shops.js"></script>
<script src="js/shops-art.js"></script>
<script src="js/city.js"></script>
<script src="js/fight.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
